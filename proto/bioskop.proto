syntax = "proto3";

package bioskop;

service LayananBioskop {
  rpc LihatKursi (LihatKursiRequest) returns (DaftarKursiResponse);
  rpc PesanKursi (PesanKursiRequest) returns (HasilPesanResponse);
  rpc PesanBeberapaKursi (PesanBeberapaKursiRequest) returns (HasilPesanBanyakResponse);
  rpc BatalkanPesanan (BatalkanPesananRequest) returns (HasilPesanResponse);
  rpc PantauKursi (PantauKursiRequest) returns (stream PembaruanKursi);
}

message LihatKursiRequest {}

message Kursi {
  string id = 1;
  string baris = 2;
  int32 nomor = 3;
  bool tersedia = 4;
}

message DaftarKursiResponse {
  repeated Kursi kursi = 1;
  int64 versi = 2;
}

message PesanKursiRequest {
  string request_id = 1;
  string kursi_id = 2;
  string nama_pemesan = 3;
}

message BatalkanPesananRequest {
  string request_id = 1;
  string booking_id = 2;
  // Opsional (kompatibel ke belakang): kalau diisi, server menolak
  // pembatalan bila namanya tidak cocok dengan nama pemesan.
  string nama_pemesan = 3;
}

message HasilPesanResponse {
  bool sukses = 1;
  string pesan = 2;
  string booking_id = 3;
  string kursi_id = 4;
}

message PesanBeberapaKursiRequest {
  string request_id = 1;
  repeated string kursi_id = 2;
  string nama_pemesan = 3;
}

message TiketPesanan {
  string booking_id = 1;
  string kursi_id = 2;
}

message HasilPesanBanyakResponse {
  bool sukses = 1;
  string pesan = 2;
  repeated TiketPesanan pesanan = 3;
}

message PantauKursiRequest {}

message PembaruanKursi {
  repeated Kursi kursi = 1;
  int64 versi = 2;
}
