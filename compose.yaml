services:
  server:
    build: .
    command: python server.py
    environment:
      BIOSKOP_DB_PATH: /app/data/bioskop.db
    volumes:
      - bioskop-data:/app/data
    ports:
      - "50051:50051"
    restart: unless-stopped

  web:
    build: .
    command: uvicorn gateway:app --host 0.0.0.0 --port 8000
    environment:
      GRPC_TARGET: server:50051
    ports:
      - "8000:8000"
    depends_on:
      - server
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  bioskop-data:
